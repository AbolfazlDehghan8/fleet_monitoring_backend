services:
  obu:
    build: .
    container_name: fleet_obu
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal:8000/api/v1}
      API_HOST_HEADER: ${API_HOST_HEADER:-localhost:8000}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      SEND_INTERVAL_SECONDS: ${SEND_INTERVAL_SECONDS:-5}
      DISCOVERY_INTERVAL_SECONDS: ${DISCOVERY_INTERVAL_SECONDS:-10}
      MAX_PACKETS_PER_MINUTE: ${MAX_PACKETS_PER_MINUTE:-90}
      SEND_FOR_STATUSES: ${SEND_FOR_STATUSES:-active}
      REQUIRE_DRIVER: ${REQUIRE_DRIVER:-true}
      START_LAT: ${START_LAT:-35.6892}
      START_LON: ${START_LON:-51.3890}