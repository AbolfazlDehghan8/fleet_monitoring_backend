version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: fleet_postgres
    environment:
      POSTGRES_DB: fleet_db
      POSTGRES_USER: fleet_user
      POSTGRES_PASSWORD: fleet_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet_user -d fleet_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fleet_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: fleet_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: fleet_user
      RABBITMQ_DEFAULT_PASS: fleet_password
      RABBITMQ_DEFAULT_VHOST: fleet_vhost
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:1.21.0
    container_name: fleet_pgbouncer
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: fleet_user
      DB_PASSWORD: fleet_password
      DB_NAME: fleet_db
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 500
      DEFAULT_POOL_SIZE: 50
      ADMIN_USERS: fleet_user
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "6432", "-U", "fleet_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: fleet_web
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: pgbouncer
      DB_PORT: 6432
      REDIS_URL: redis://redis:6379/1
      RABBITMQ_URL: amqp://fleet_user:fleet_password@rabbitmq:5672/fleet_vhost
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  celery_worker:
    build: .
    container_name: fleet_celery_worker
    command: celery -A fleet_monitoring worker --loglevel=info -Q telemetry.raw.process,alerts.trigger.notify,reports.generate,tasks.dead_letter
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DB_HOST: pgbouncer
      DB_PORT: 6432
      REDIS_URL: redis://redis:6379/1
      RABBITMQ_URL: amqp://fleet_user:fleet_password@rabbitmq:5672/fleet_vhost
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  celery_beat:
    build: .
    container_name: fleet_celery_beat
    command: celery -A fleet_monitoring beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DB_HOST: pgbouncer
      DB_PORT: 6432
      REDIS_URL: redis://redis:6379/1
      RABBITMQ_URL: amqp://fleet_user:fleet_password@rabbitmq:5672/fleet_vhost
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  celery_exporter:
    build: .
    container_name: fleet_celery_exporter
    command: celery-prometheus-exporter --broker-url=amqp://fleet_user:fleet_password@rabbitmq:5672/fleet_vhost
    ports:
      - "9808:9808"
    env_file:
      - .env
    depends_on:
      rabbitmq:
        condition: service_healthy

  flower:
    build: .
    container_name: fleet_flower
    command: celery -A fleet_monitoring flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - .env
    environment:
      DB_HOST: pgbouncer
      DB_PORT: 6432
      REDIS_URL: redis://redis:6379/1
      RABBITMQ_URL: amqp://fleet_user:fleet_password@rabbitmq:5672/fleet_vhost
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: